services:
  web:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://vyora:vyora_local_only@db:5432/vyora
      SQLITE_PATH: /app/data/vyora.sqlite3
    depends_on:
      db:
        condition: service_healthy
  worker:
    build: .
    command: python worker.py
    env_file: .env
    environment:
      DATABASE_URL: postgresql://vyora:vyora_local_only@db:5432/vyora
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vyora
      POSTGRES_PASSWORD: vyora_local_only
      POSTGRES_DB: vyora
    volumes: ["vyora-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vyora"]
      interval: 5s
      retries: 10
volumes:
  vyora-db:
