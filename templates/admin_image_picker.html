<section class="editor-image-picker"><label>Chwazi yon foto<input type="file" class="editor-image-file" accept="image/jpeg,image/png,image/webp" {{'disabled' if not services.Storage else ''}}></label><button type="button" class="btn secondary editor-image-upload" {{'disabled' if not services.Storage else ''}}>Chaje foto a</button><p class="editor-image-status muted" role="status"></p><img class="editor-image-preview" src="{{r.image or ''}}" alt="" {{'hidden' if not r.image else ''}}><label>Bibliyotèk foto<select class="editor-image-library"><option value="">Chwazi nan bibliyotèk la</option>{% for media in media_library %}<option value="{{media.url}}">{{loop.index}} · {{media.content_type}}</option>{% endfor %}</select></label>{% if mode=='articles' %}<button type="button" class="text-button editor-image-insert">Ajoute foto nan tèks la</button>{% endif %}</section>
