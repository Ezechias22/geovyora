<section class="editor-video-picker" data-max-bytes="{{max_video_bytes}}"><label>Fichye videyo<input type="file" class="editor-video-file" accept="video/*" {{'disabled' if not services.Mux else ''}}></label><button type="button" class="btn secondary editor-video-upload" {{'disabled' if not services.Mux else ''}}>Chaje videyo a</button><label>Ajoute videyo nan tèks la<select class="editor-video-library"><option value="">Chwazi yon videyo ki pare</option>{% for video in video_library %}<option value="{{video.slug}}" data-no-translate>{{video.title}}</option>{% endfor %}</select></label><button type="button" class="btn secondary editor-video-insert">Ajoute videyo nan tèks la</button><a class="text-button" href="/admin/videos" target="_blank" rel="noopener">Louvri paj chajman videyo</a><p class="editor-video-status muted" role="status"></p></section>
