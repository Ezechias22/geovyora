{% if profiles %}<section class="creators-section section"><div class="section-heading"><div><span class="eyebrow green"><span>{{t.haiti|upper}}</span> &amp; <span>Dyaspora</span></span><h2>{{t.creators}}<span class="heading-dot">.</span></h2></div><a href="/{{locale}}/influencers">{{t.see_all}}</a></div><div class="creator-grid">{% for p in profiles %}<a href="/{{locale}}/influencer/{{p.slug}}" class="creator-card"><div class="creator-art color-{{loop.index}}"><span>{{p.name.split()[0][:1]}}{{p.name.split()[-1][:1]}}</span>{% if p.demo %}<small>{{t.demo}}</small>{% endif %}<span class="creator-number">0{{loop.index}}</span></div><div class="creator-info"><span>{{p.category}}</span><h3>{{p.name}}</h3><p>{{p.origin}} · {{p.residence}}</p></div></a>{% endfor %}</div></section>
{% endif %}
